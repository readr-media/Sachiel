query Publishers {
  publishers {
    id
    title
    logo
    rss
    official_site
    sponsorCount: followerCount
    wallet
  }
}

query GetPublisherFollowerList($publisherId: String, $takes: Int!) {
  publishers(where: { customId: { equals: $publisherId } }) {
    id
    title
    logo
    followerCount
    follower(take: $takes) {
      id
      customId
      name
      avatar
    }
  }
}

query GetPublisherName($publisherCustomId: String) {
  publishers(where: { customId: { equals: $publisherCustomId } }) {
    title
  }
}

query GetPublisherWallet($id: ID) {
  publisher(where: { id: $id }) {
    id
    title
    admin {
      id
      wallet
    }
  }
}

query GetExchangePublisherInfo($customId: String) {
  publishers(where: { customId: { equals: $customId } }) {
    id
    title
    admin {
      id
      wallet
    }
  }
  officialWallet: publishers(where: { customId: { equals: "readr" } }) {
    id
    title
    admin {
      id
      wallet
    }
  }
}
