query Publishers {
  publishers {
    id
    title
    logo
    rss
    official_site
    sponsorCount: followerCount
    wallet
  }
}

query GetPublisherFollowerList($publisherId: String, $takes: Int!) {
  publishers(where: { customId: { equals: $publisherId } }) {
    id
    title
    logo
    followerCount
    follower(take: $takes) {
      id
      customId
      name
      avatar
    }
  }
}

query GetPublisherName($publisherCustomId: String) {
  publishers(where: { customId: { equals: $publisherCustomId } }) {
    title
  }
}

query GetPublisherWallet($id: ID) {
  publisher(where: { id: $id }) {
    id
    title
    admin {
      id
      wallet
    }
  }
}

query GetPublisherTransactions($publisherCustomId: String) {
  transactionsCount(
    where: {
      policy: { publisher: { customId: { equals: $publisherCustomId } } }
      status: { equals: Success }
    }
  )
  transactions(
    where: {
      policy: { publisher: { customId: { equals: $publisherCustomId } } }
      status: { equals: Success }
    }
    orderBy: { createdAt: desc }
  ) {
    id
    tid
    member {
      name
      avatar
    }
    unlockStory {
      id
      title
    }
    policy {
      type
      charge
      unlockSingle
      explanation
    }
    createdAt
  }

  publishers(where: { customId: { equals: $publisherCustomId } }) {
    sponsoredCount
    sponsored(
      where: { status: { equals: Success } }
      orderBy: { createdAt: desc }
    ) {
      id
      tid
      sponsor {
        customId
        name
        avatar
      }
      fee
      createdAt
    }
  }
  redeemsCount: exchangesCount(
    where: {
      publisher: { customId: { equals: $publisherCustomId } }
      status: { equals: Success }
    }
  )
  redeems: exchanges(
    where: {
      publisher: { customId: { equals: $publisherCustomId } }
      status: { equals: Success }
    }
    orderBy: { createdAt: desc }
  ) {
    id
    tid
    exchangeVolume
    publisher {
      logo
      title
    }
    status
    createdAt
  }
}
