query Publishers {
  publishers(where: { is_active: { equals: true } }) {
    id
    customId
    title
    logo
    rss
    official_site
    followerCount
    wallet
    createdAt
  }
}

query GetPublisherFollowerList($publisherId: String, $takes: Int!) {
  publishers(where: { customId: { equals: $publisherId } }) {
    id
    title
    logo
    followerCount
    follower(take: $takes) {
      id
      customId
      name
      avatar
    }
  }
}

query GetPublisherForOG($publisherCustomId: String) {
  publishers(where: { customId: { equals: $publisherCustomId } }) {
    title
    logo
  }
}

query GetPublisherWallet($id: ID) {
  publisher(where: { id: $id }) {
    id
    title
    admin {
      id
      wallet
    }
  }
}

query GetExchangePublisherInfo($customId: String) {
  publishers(where: { customId: { equals: $customId } }) {
    id
    title
    admin {
      id
      wallet
    }
  }
  officialWallet: publishers(where: { customId: { equals: "mesh" } }) {
    id
    title
    admin {
      id
      wallet
    }
  }
}

query GetPublisherReports($publisherCustomId: String) {
  publishers(where: { customId: { equals: $publisherCustomId } }) {
    id
    statements(where: { type: { equals: media } }) {
      id
      title
      type
      start_date
      end_date
      url
    }
  }
}
