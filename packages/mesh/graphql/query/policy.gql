query GetPublisherPolicy($customId: String) {
  policies(
    where: {
      publisher: { customId: { equals: $customId } }
      unlockSingle: { equals: true }
    }
  ) {
    id
    name
    charge
    duration
    publisher {
      id
      title
      admin {
        id
        wallet
      }
    }
  }
}
